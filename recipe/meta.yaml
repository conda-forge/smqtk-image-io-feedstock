{% set name = "smqtk-image-io" %}
{% set version = "0.19.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/smqtk_image_io-{{ version }}.tar.gz
  sha256: bac3fb447493372498d855233af739050baedaf55b6e15db813bea39b34dffa5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - poetry-core
  run:
    - python >={{ python_min }},<4.0
    - pillow >=12.3.0
    - numpy >=1.23.5
    - smqtk-core >=0.22.0
    - smqtk-dataprovider >=0.20.0

test:
  imports:
    - smqtk_image_io
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/smqtk-image-io/
  summary: SMQTK Image IO
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - Purg
    - barry-ravichandran
